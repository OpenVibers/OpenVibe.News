## ═══════════════════════════════════════════════════════════════
## openvibe.news — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.news.conf — keep them in sync and reload nginx
## after changing it. The Node app (port 4820, systemd unit openvibe-news) renders every page;
## nginx terminates TLS, redirects www → apex, rate-limits auth, editor and API, and compresses text.
##
## No proxy_cache here on purpose: the app decides cacheability per response (Cache-Control
## public only for public posts and lists shown to anonymous visitors; private, no-store for
## everything else, Vary: Cookie, Authorization). A cache added in front must honour those headers.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovnews_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovnews_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovnews_write:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.news www.openvibe.news;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.news$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.news;

    ssl_certificate     /etc/letsencrypt/live/openvibe.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.news/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.news$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.news;

    ssl_certificate     /etc/letsencrypt/live/openvibe.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.news/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.news.access.log;
    error_log  /var/log/nginx/openvibe.news.error.log;

    # Editor forms are URL-encoded text (no uploads); the Events webhook body is at most 256 KB.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/feed+json image/svg+xml text/plain application/xml text/xml application/rss+xml application/atom+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints (strict) ──────────────
    location /auth/ {
        limit_req zone=ovnews_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4820;
    }

    # ── The editor desk and cluster pages (forms, editors only) ──
    location /edit {
        limit_req zone=ovnews_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:4820;
    }
    location /clusters/ {
        limit_req zone=ovnews_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:4820;
    }

    # ── The Events webhook: OpenVibe.Events delivers over loopback, never through the public vhost ──
    location /internal/ { return 404; }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=ovnews_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4820;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4820/metrics) ──
    location = /metrics { return 404; }

    # ── Pages, feeds, sitemaps, robots.txt, llms.txt, static assets ──
    location / {
        proxy_pass http://127.0.0.1:4820;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
