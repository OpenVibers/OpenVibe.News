name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1   # production runs Node 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # News' service manifest and capabilities are proposals (docs/) until the lead releases them
      # in openvibe-contracts; until then the check reports "no service manifest news" (placeholder).
      - run: npx openvibe-contracts-check --service news --src server
        continue-on-error: true
